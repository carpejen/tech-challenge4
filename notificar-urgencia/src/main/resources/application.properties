# Handler desta Lambda (CDI @Named da classe NotificarUrgenciaHandler)
quarkus.lambda.handler=notificar

# E-mails (vêm das variáveis de ambiente definidas no template.yaml, lidas do Parameter Store)
app.email-remetente=${EMAIL_REMETENTE:remetente@exemplo.com}
app.email-admin=${EMAIL_ADMIN:admin@exemplo.com}

# Cliente HTTP leve recomendado para Lambda
quarkus.ses.sync-client.type=url

# Não subir LocalStack automaticamente (testes são unitários)
quarkus.ses.devservices.enabled=false

# ============================================================
# Ambiente local - LocalStack
# Ativado somente com o profile local
# ============================================================

%local.quarkus.ses.endpoint-override=http://localstack:4566
%local.quarkus.ses.aws.region=us-east-2
%local.quarkus.ses.aws.credentials.type=static
%local.quarkus.ses.aws.credentials.static-provider.access-key-id=test
%local.quarkus.ses.aws.credentials.static-provider.secret-access-key=test
