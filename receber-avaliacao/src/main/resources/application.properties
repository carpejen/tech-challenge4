# Handler desta Lambda (CDI @Named da classe ReceberAvaliacaoHandler)
quarkus.lambda.handler=receber

# Recursos AWS (vêm das variáveis de ambiente definidas no template.yaml)
app.tabela-avaliacoes=${TABELA_AVALIACOES:avaliacoes-local}
app.fila-criticas-url=${FILA_CRITICAS_URL:http://localhost/fila-criticas-local}

# Cliente HTTP leve (url-connection-client) recomendado para Lambda.
# Região e credenciais vêm automaticamente do ambiente da Lambda.
quarkus.dynamodb.sync-client.type=url
quarkus.sqs.sync-client.type=url

# Não subir LocalStack automaticamente (os testes são unitários, sem AWS).
quarkus.dynamodb.devservices.enabled=false
quarkus.sqs.devservices.enabled=false

# ============================================================
# Ambiente local - LocalStack
# Ativado somente quando QUARKUS_PROFILE=local
# ============================================================

%local.quarkus.dynamodb.endpoint-override=http://localstack:4566
%local.quarkus.dynamodb.aws.region=us-east-2
%local.quarkus.dynamodb.aws.credentials.type=static
%local.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=test
%local.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=test

%local.quarkus.sqs.endpoint-override=http://localstack:4566
%local.quarkus.sqs.aws.region=us-east-2
%local.quarkus.sqs.aws.credentials.type=static
%local.quarkus.sqs.aws.credentials.static-provider.access-key-id=test
%local.quarkus.sqs.aws.credentials.static-provider.secret-access-key=test
