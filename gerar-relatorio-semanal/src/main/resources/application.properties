# Handler desta Lambda (CDI @Named da classe GerarRelatorioSemanalHandler)
quarkus.lambda.handler=relatorio

# Recursos AWS (vêm das variáveis de ambiente definidas no template.yaml)
app.tabela-avaliacoes=${TABELA_AVALIACOES:avaliacoes-local}
app.email-remetente=${EMAIL_REMETENTE:remetente@exemplo.com}
app.email-admin=${EMAIL_ADMIN:admin@exemplo.com}

# Clientes HTTP leves recomendados para Lambda
quarkus.dynamodb.sync-client.type=url
quarkus.ses.sync-client.type=url

# Testes são unitários e não sobem serviços locais automaticamente
quarkus.dynamodb.devservices.enabled=false
quarkus.ses.devservices.enabled=false

# ============================================================
# Ambiente local - LocalStack
# Ativado somente com o profile local
# ============================================================

%local.quarkus.dynamodb.endpoint-override=http://localstack:4566
%local.quarkus.dynamodb.aws.region=us-east-2
%local.quarkus.dynamodb.aws.credentials.type=static
%local.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=test
%local.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=test

%local.quarkus.ses.endpoint-override=http://localstack:4566
%local.quarkus.ses.aws.region=us-east-2
%local.quarkus.ses.aws.credentials.type=static
%local.quarkus.ses.aws.credentials.static-provider.access-key-id=test
%local.quarkus.ses.aws.credentials.static-provider.secret-access-key=test